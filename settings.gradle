pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        mavenCentral()
        maven { url = uri("https://repo.papermc.io/repository/maven-public/") }
        maven { url = uri("https://repo.extendedclip.com/content/repositories/placeholderapi/") }
    }
}

rootProject.name = "TabelaAPI"

include(
    "tabela-api",
    "tabela-core",
    "tabela-platform-bukkit",
    "tabela-platform-paper",
    "tabela-platform-folia",
    "tabela-platform-legacy",
    "tabela-velocity",
    "tabela-plugin",
    "tabela-testkit"
)
