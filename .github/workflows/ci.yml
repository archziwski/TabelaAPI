name: CI
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tabelaapi-build
          path: '**/build/libs/*.jar'
