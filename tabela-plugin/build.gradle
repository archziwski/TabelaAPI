plugins { id 'maven-publish' }

dependencies {
    implementation project(':tabela-platform-paper')
    implementation project(':tabela-platform-folia')
    implementation project(':tabela-platform-legacy')
    compileOnly 'io.papermc.paper:paper-api:1.20.6-R0.1-SNAPSHOT'
}

tasks.withType(JavaCompile).configureEach { options.release = 21 }

processResources {
    filesMatching('plugin.yml') { expand(version: project.version) }
}

tasks.jar {
    archiveBaseName = 'TabelaAPI'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    dependsOn configurations.runtimeClasspath
    from({
        configurations.runtimeClasspath
            .filter { it.exists() }
            .collect { it.isDirectory() ? it : zipTree(it) }
    })
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
}
